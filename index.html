<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>水陸直播總控</title>
<style>
/* 控制室深色版面：畫面為主；每格上方一條狀態列（綠＝在播、黃＝緩衝／暫停、紅＝異常、灰＝等待開播），正在聽聲音的那格框青色 */
:root{
  --bg:#0d1015; --panel:#161a21; --panel2:#1d222b; --line:#28303b; --fg:#e8ebf0; --muted:#8c95a4;
  --accent:#45c3ff; --ok:#3ccb73; --warn:#eab33c; --bad:#f15454; --idle:#5f6875;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}  /* 不加這行，.msg、按鈕的 display 會蓋過 hidden，錯誤底板會一直壓在畫面上（11/20 每格偏暗的原因） */
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--font);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.spacer{flex:1}
#sum{font-size:13px;color:var(--muted);white-space:nowrap}
#sum b{color:var(--fg)}
#sum .bad{color:var(--bad)}
#clock{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;letter-spacing:.03em}
#ver{font-size:11px;color:var(--muted)}
button,.btn{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center}
button:hover,.btn:hover{border-color:#46505f}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
main{flex:1;min-height:0;overflow:auto;padding:10px}
.grid{display:grid;gap:10px;justify-content:center;align-content:center;min-height:100%}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
/* 11/23-6：正在聽的那一格（按了「聲音」）框改紅色、加外圈，一眼看出聽的是哪一壇（使用者：「小視窗聲音打開，框框變成紅色」） */
.tile.audio{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.bar{display:flex;align-items:center;gap:6px;padding:0 6px;height:34px;min-width:0;border-top:4px solid var(--idle)}
.tile[data-s="ok"] .bar{border-top-color:var(--ok)}
.tile[data-s="warn"] .bar{border-top-color:var(--warn)}
.tile[data-s="bad"] .bar{border-top-color:var(--bad)}
.num{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--muted);min-width:1.2em;text-align:center}
.tile{container-type:inline-size}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:3.2em;max-width:45%}
@container (max-width:380px){ .vt{display:none} .tools{gap:3px} .tools button,.tools .btn{padding:2px 5px} }
@container (max-width:330px){ .num{display:none} .bar{gap:4px;padding:0 4px} .chip{font-size:11px;padding:1px 5px} .tools button,.tools .btn{padding:2px 4px;font-size:11px} }
.chip{font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap;background:var(--idle);color:#0b0d10;flex:none}
.tile[data-s="ok"] .chip{background:var(--ok)}
.tile[data-s="warn"] .chip{background:var(--warn)}
.tile[data-s="bad"] .chip{background:var(--bad);color:#fff}
.vt{flex:1 1 0;min-width:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:4px;flex:none}
.tools button,.tools .btn{padding:2px 8px;font-size:12px}
.tools button.on{background:var(--accent);border-color:var(--accent);color:#04131c;font-weight:700}
.dup{background:var(--bad);color:#fff;font-size:12px;font-weight:700;padding:2px 8px}
.video{position:relative;aspect-ratio:16/9;background:#000;max-width:100%}
.video iframe,.video .ph{position:absolute;inset:0;width:100%;height:100%;border:0}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;padding:16px;background:rgba(8,10,14,.86);font-size:13px}
.tile.max{position:fixed;inset:0;z-index:50;border-radius:0;border-width:0}
.tile.max .video{flex:1;aspect-ratio:auto}
.empty{max-width:34em;margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;padding:40px 16px}
.empty b{color:var(--fg);font-size:16px}
.banner{background:var(--bad);color:#fff;padding:8px 12px;font-weight:700}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;width:min(560px,calc(100vw - 32px));padding:16px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 6px;font-size:16px}
dialog p{margin:0 0 10px;color:var(--muted);font-size:13px}
dialog textarea{width:100%;height:46vh;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:13px/1.5 var(--font)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
#parseInfo{font-size:12px;color:var(--muted);flex:1;min-width:12em}
#autoBtn:not(.on){color:var(--warn);border-color:var(--warn)}  /* 關掉時用黃色提醒 */
#sum .warn{color:var(--warn)}
/* 音量條：只有在 Mac 用「開總控頁.command」開才有（Mac 在背景抓每格直播的聲音）。
   條＝每 0.1 秒的峰值（dBFS，−60～0），顏色分區跟 OBS 一樣：−20 以下綠、−20～−9 黃、−9 以上紅；白線＝最近 1.5 秒最高。
   做法：底色整條是綠黃紅，用 i 從右邊蓋住沒亮的部分；b 是白線 */
.lv{display:flex;align-items:center;gap:6px;height:21px;padding:0 8px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);flex:none}
.lvbar{flex:1;height:9px;border-radius:4px;overflow:hidden;position:relative;min-width:40px;
  background:linear-gradient(90deg,var(--ok) 0 78.33%,var(--warn) 78.33% 96.67%,var(--bad) 96.67%)}  /* 跟「輸出音量監測表」、使用者的 OBS（真峰值）一樣：−13 dB 起黃、−2 dB 起紅 */
.lvbar::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.6) calc(10% - 1px) 10%)}  /* 刻度每 6 dB 一格（−60～0） */
.lvbar i{position:absolute;right:0;top:0;bottom:0;width:100%;background:#05070a;transform-origin:right center;will-change:transform}  /* 11/23-3：一秒 60 次用 transform 畫，不用 transition */
.lvbar b{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-2px;background:#fff;opacity:.9;display:none;z-index:2}
.lvtxt{white-space:nowrap;font-variant-numeric:tabular-nums}
.lv.silent .lvtxt{color:var(--warn);font-weight:700}
/* 11/23-4：音量暫停（量音量的電腦沒開、連不上中繼站）：條灰掉，不算沒聲音 */
.lv.off .lvbar{background:#2b3038}
.lv.off .lvbar b,.lv.off .lvbar::after{display:none}
.lv.off .lvbar i{transform:scaleX(0)!important}
.lv.silent.long .lvtxt{color:var(--bad)}
@container (max-width:330px){ .lvavg{display:none} }
.primary{background:var(--accent);border-color:var(--accent);color:#04131c;font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:700;z-index:60}
#relay{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;cursor:help}
#relay i{width:9px;height:9px;border-radius:50%;background:#888;flex:none}
#relay.ok i{background:#3ecf6e}
#relay.bad i{background:#e5484d}
/* 11/23-6 修（使用者：「跑到左邊？」）：中繼燈一律用短字（完整說明在滑鼠提示）；
   中繼燈＋時鐘＋版本字包成一組靠右，標題列放不下時整組換到下一行、仍然靠右 */
#relay .rs{display:inline;font-weight:400}
#relay .rl{display:none;font-weight:400}
#rt{display:inline-flex;align-items:center;gap:12px;margin-left:auto;white-space:nowrap}
@media (max-width:700px){
  #relay .rl{display:none}
  #relay .rs{display:inline}
  #clock{font-size:16px}
  .vt{display:none}
  main{padding:8px}
}
</style>
</head>
<body>
<div id="fileBanner" class="banner" hidden>這樣打開看不到影片：請在 Finder 點兩下同資料夾的「開總控頁.command」，用它開的網頁才看得到。</div>
<header>
  <h1>水陸直播總控</h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <span id="sum"></span>
  <button id="muteAll" title="快捷鍵 0">全部靜音</button>
  <button id="reloadAll">全部重載</button>
  <button id="editBtn">編輯網址</button>
  <button id="linkBtn" title="複製上網版連結（含現在的網址清單），貼到 LINE 給自己或組員，用手機、別台電腦打開">複製手機連結</button>
  <button id="playAll" title="所有畫面一起繼續播放">全部播放</button>
  <button id="autoBtn" title="已結束、畫面停住、緩衝太久、等待開播太久、載入太久時，自動重載那一格">自動重載：開</button>
  <span id="rt"><span id="relay" hidden><i></i><b class="rl"></b><b class="rs"></b></span><span id="clock">--:--:--</span><span id="ver">11/23-7</span></span>
</header>
<main id="main"><div class="grid" id="grid"></div></main>

<dialog id="editor">
  <h2>編輯網址</h2>
  <p>把 LINE 上的網址清單整段貼進來：一行壇名、下一行網址（同一行「總壇：網址」也可以）。沒接網址的那一行會當成分組標題，例如「1120正式上線網址」。</p>
  <textarea id="editText" spellcheck="false"></textarea>
  <div class="row">
    <span id="parseInfo"></span>
  </div>
  <div class="row">
    <button id="resetBtn">還原預設清單</button>
    <button id="shareBtn" hidden>複製分享連結</button>
    <span class="spacer"></span>
    <button id="cancelBtn">取消</button>
    <button id="applyBtn" class="primary">套用</button>
  </div>
</dialog>
<div id="toast" hidden></div>

<script src="streams.js"></script>
<script>
'use strict';
const LS_TEXT = 'shuilu-mv-text', LS_VIEW = 'shuilu-mv-view', ALL = '全部';
const ONLINE_URL = 'https://a25880408-web.github.io/shuilu-monitor/';  // 上網版（GitHub Pages）；網址清單放在 # 後面，不會存到 GitHub
const DEFAULT_TEXT = (window.DEFAULT_STREAMS || '').trim();
const $ = id => document.getElementById(id);
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }

/* ---------- 解析 LINE 格式的網址清單 ---------- */
const URL_RE = /(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com|youtu\.be)\/\S+/i;
function extractId(u){
  const m = u.match(/youtu\.be\/([\w-]{11})/i) || u.match(/[?&]v=([\w-]{11})/) || u.match(/\/(?:live|embed|shorts|v)\/([\w-]{11})/i);
  return m ? m[1] : null;
}
const cleanName = s => s.replace(/^[\s:：]+|[\s:：]+$/g, '').trim();
const cleanGroup = s => cleanName(s).replace(/網址$/, '').trim() || cleanName(s);
function parse(text){
  const items = [], bad = [];
  let group = '', pending = null;
  for (const raw of String(text).split(/\r?\n/)){
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(URL_RE);
    if (!m){ if (pending !== null) group = cleanGroup(pending); pending = line; continue; }
    const before = cleanName(line.slice(0, m.index));
    let name;
    if (before){ if (pending !== null) group = cleanGroup(pending); name = before; }
    else name = pending !== null ? cleanName(pending) : '';
    pending = null;
    const id = extractId(m[0]);
    if (!id){ bad.push(line); continue; }
    items.push({ group: group || '清單', name: name || ('畫面' + (items.length + 1)), id });
  }
  return { items, bad };
}

/* ---------- 分享連結（網址清單放在 # 後面，不會送到伺服器） ---------- */
function enc(s){ const b = new TextEncoder().encode(s); let bin = ''; b.forEach(x => bin += String.fromCharCode(x)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function dec(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }

// 短版手機連結（11/21-8 起）。三種寫法，打開時都換回 LINE 那種清單文字：
//   #s=20261122.0EZJnwD6c9PQ1yGWOJwR_Gqs…   分組標題是「8 位數日期＋法會」、壇名都在 SHORT_NAMES 裡：一壇＝1 個代號＋11 字影片代碼，「.」隔開日期和各壇
//   #m=（base64）                             其他清單：每組「#標題」一行、每壇「11 字代碼＋壇名」一行
//   #list=（base64）                          11/21-7 以前的長連結：整份清單文字，照樣能開
// SHORT_NAMES 只能往後加，不能改順序或刪（已經傳出去的短連結會對到別的壇）。
const SHORT_NAMES = ['總壇', '大壇', '法華壇', '祈願壇', '地藏壇', '楞嚴壇', '瑜伽焰口壇', '華嚴壇', '藥師壇', '淨土壇'];
const SHORT_CODES = '0123456789abcdefghijklmnopqrstuvwxyz';
const ymd = (d = new Date()) => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
function packList(t){
  const byGroup = new Map();
  for (const it of parse(t).items){ if (!byGroup.has(it.group)) byGroup.set(it.group, []); byGroup.get(it.group).push(it); }
  // 前幾天的分組（標題開頭是比今天早的日期）不放進連結，除非正在看那一組；全部都是前幾天的就照放
  let gs = [...byGroup.keys()];
  const today = ymd(), kept = gs.filter(g => { const m = g.match(/^(\d{8})/); return !m || m[1] >= today || g === view; });
  if (kept.length) gs = kept;
  if (!gs.length) return null;
  const short = [];
  for (const g of gs){
    const m = g.match(/^(\d{8})法會$/);
    const codes = byGroup.get(g).map(it => { const i = SHORT_NAMES.indexOf(it.name); return i < 0 ? null : SHORT_CODES[i] + it.id; });
    if (!m || codes.includes(null)){ short.length = 0; break; }
    short.push(m[1], codes.join(''));
  }
  if (short.length) return 's=' + short.join('.');
  const lines = [];
  for (const g of gs){ lines.push('#' + g); byGroup.get(g).forEach(it => lines.push(it.id + it.name)); }
  return 'm=' + enc(lines.join('\n'));
}
function listToText(groups){
  return groups.map(([title, its]) => title + '\n\n' + its.map(([name, id]) => name + '：\nhttps://www.youtube.com/watch?v=' + id).join('\n\n')).join('\n\n');
}
function unpackList(h){   // 讀不懂回傳 null
  try {
    if (h.startsWith('#list=')) return dec(h.slice(6));
    const out = [];
    if (h.startsWith('#s=')){
      const parts = h.slice(3).split('.');
      for (let i = 0; i + 1 < parts.length; i += 2){
        const date = parts[i], s = parts[i + 1], its = [];
        if (!/^\d{8}$/.test(date) || !s || s.length % 12) return null;
        for (let j = 0; j < s.length; j += 12){
          const k = SHORT_CODES.indexOf(s[j]), id = s.slice(j + 1, j + 12);
          if (k < 0 || k >= SHORT_NAMES.length || !/^[\w-]{11}$/.test(id)) return null;
          its.push([SHORT_NAMES[k], id]);
        }
        out.push([date + '法會', its]);
      }
    } else if (h.startsWith('#m=')){
      for (const line of dec(h.slice(3)).split('\n')){
        if (line.startsWith('#')) out.push([line.slice(1), []]);
        else if (/^[\w-]{11}./.test(line)){ if (!out.length) out.push(['清單', []]); out[out.length - 1][1].push([line.slice(11), line.slice(0, 11)]); }
      }
    } else return null;
    return out.length ? listToText(out) : null;
  } catch(e){ return null; }
}
const hasListHash = () => /^#(list|s|m)=/.test(location.hash);

/* ---------- 狀態 ---------- */
let text = DEFAULT_TEXT, items = [], view = ALL, players = {}, apiReady = false, apiFailed = false;

// 預設清單（streams.js）換過時，這台瀏覽器之前貼的清單讓位給新的預設清單（總管每天更新 streams.js 後，Mac 上重新整理就換好）。
// 用手機連結（#list=）帶進來的清單算使用者自己選的，不會被蓋掉，直到下一次 streams.js 再換。
const LS_DEFSEEN = 'shuilu-mv-defseen';
let defChanged = false, badLink = false;
function loadText(){
  if (hasListHash()){
    const t = unpackList(location.hash);
    history.replaceState(null, '', location.pathname + location.search);
    if (t){
      text = t; lsSet(LS_TEXT, text);
      if (DEFAULT_TEXT) lsSet(LS_DEFSEEN, DEFAULT_TEXT);
      return;
    }
    badLink = true;   // 讀不懂：照平常一樣用這台之前的清單
  }
  const saved = lsGet(LS_TEXT);
  if (saved !== null && DEFAULT_TEXT && lsGet(LS_DEFSEEN) !== DEFAULT_TEXT){
    lsSet(LS_TEXT, null); text = DEFAULT_TEXT; defChanged = true;
  } else if (saved !== null) text = saved;
  if (DEFAULT_TEXT) lsSet(LS_DEFSEEN, DEFAULT_TEXT);
}
// 分組標題帶日期（例如「20261122法會」）：打開時先看今天那組；過了半夜自動換到新的一天那組
const mmdd = (d = new Date()) => String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
function todayGroup(){ const k = mmdd(); return groups().find(g => g.includes(k)) || null; }
function groups(){ return [...new Set(items.map(i => i.group))]; }
function visible(){ return items.map((it, idx) => ({ ...it, key: 'k' + idx })).filter(it => view === ALL || it.group === view); }

/* ---------- 畫面 ---------- */
function renderTabs(){
  const gs = groups(), tabs = $('tabs');
  tabs.textContent = '';
  if (gs.length > 1) gs.unshift(ALL);
  if (!gs.includes(view)) view = gs.includes(ALL) ? ALL : (gs[0] || ALL);
  if (gs.length <= 1){ return; }
  for (const g of gs){
    const b = document.createElement('button');
    const n = g === ALL ? items.length : items.filter(i => i.group === g).length;
    b.textContent = `${g}（${n}）`;
    b.className = g === view ? 'on' : '';
    b.onclick = () => { view = g; lsSet(LS_VIEW, g); renderTabs(); renderGrid(); };
    tabs.appendChild(b);
  }
}

function destroyPlayers(){
  for (const s of Object.values(players)){ try { s.p && s.p.destroy(); } catch(e){} }
  players = {};
}

function renderGrid(){
  destroyPlayers();
  const grid = $('grid');
  grid.textContent = '';
  const vis = visible();
  if (!vis.length){
    grid.style.gridTemplateColumns = '1fr';
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = '<b>還沒有網址</b><span>按「編輯網址」，把 LINE 上的網址清單整段貼進來。</span>';
    const b = document.createElement('button'); b.className = 'primary'; b.textContent = '編輯網址'; b.onclick = openEditor;
    d.appendChild(b); grid.appendChild(d); updateSummary(); return;
  }
  const count = {}; items.forEach(i => (count[i.id] = (count[i.id] || []).concat(i.name)));
  vis.forEach((it, n) => {
    const t = document.createElement('div');
    t.className = 'tile'; t.dataset.key = it.key; t.dataset.s = 'idle';
    t.innerHTML = `<div class="bar"><span class="num"></span><span class="name"></span><span class="chip">載入中</span><span class="vt"></span>
      <span class="tools"><button data-act="audio" title="只聽這一格（快捷鍵 ${n+1}）">聲音</button><button data-act="max">放大</button><button data-act="reload">重載</button><a class="btn" target="_blank" rel="noopener" title="在 YouTube 打開這一格">↗</a></span></div>
      <div class="dup" hidden></div><div class="video"><div class="ph"></div><div class="msg" hidden></div></div>
      <div class="lv" hidden><span class="lvbar"><i></i><b></b></span><span class="lvtxt">聲音準備中…</span><span class="lvavg"></span></div>`;
    t.querySelector('.num').textContent = n + 1;
    t.querySelector('.name').textContent = it.name;
    t.querySelector('.name').title = `${it.group}｜${it.name}`;
    t.querySelector('a.btn').href = 'https://www.youtube.com/watch?v=' + it.id;
    if (view === ALL && groups().length > 1) t.querySelector('.vt').textContent = it.group;
    const others = count[it.id].filter(x => x !== it.name);
    if (count[it.id].length > 1){
      const d = t.querySelector('.dup'); d.hidden = false;
      d.textContent = `⚠ 這格跟「${others.join('、') || it.name}」是同一個網址，請確認`;
    }
    t.addEventListener('click', e => {
      const b = e.target.closest('button[data-act]'); if (!b) return;
      const a = b.dataset.act;
      if (a === 'audio') solo(it.key);
      else if (a === 'max') toggleMax(t);
      else if (a === 'reload') reloadOne(it.key);
    });
    grid.appendChild(t);
    players[it.key] = { item: it, tile: t, p: null, err: null, lastT: null, stall: 0, buf: 0, title: '' };
  });
  layout();
  buildPlayers();
  updateSummary();
}

function layout(){
  const main = $('main'), grid = $('grid');
  const n = grid.querySelectorAll('.tile').length;
  if (!n) return;
  const gap = 10, barH = 42 + (lvOn ? 21 : 0);
  const W = main.clientWidth - 20, H = main.clientHeight - 20;
  if (W < 640){ grid.style.gridTemplateColumns = '1fr'; return; }
  let best = { w: 0, c: 1 };
  for (let c = 1; c <= n; c++){
    const r = Math.ceil(n / c);
    const w = Math.min((W - gap * (c - 1)) / c, ((H - gap * (r - 1)) / r - barH) * 16 / 9);
    if (w > best.w) best = { w, c };
  }
  if (best.w < 300){ // 太小就改成可以往下捲
    const c = Math.max(1, Math.floor((W + gap) / (300 + gap)));
    best = { c, w: (W - gap * (c - 1)) / c };
  }
  grid.style.gridTemplateColumns = `repeat(${best.c}, ${Math.floor(best.w)}px)`;
}

/* ---------- YouTube 播放器 ---------- */
window.onYouTubeIframeAPIReady = () => { apiReady = true; buildPlayers(); };
function buildPlayers(){
  if (!apiReady) return;
  for (const s of Object.values(players)) if (!s.p) makePlayer(s);
}
// 先用 youtube-nocookie.com（11/20 使用者的 Chrome 嵌 youtube.com 會錯誤 153、nocookie 正常），錯誤 153 就自動換另一個再試一次
const HOSTS = ['https://www.youtube-nocookie.com', 'https://www.youtube.com'];
function makePlayer(s){
  const holder = s.tile.querySelector('.ph');
  s.err = null; s.lastT = null; s.stall = 0; s.buf = 0;
  if (s.hostIdx == null) s.hostIdx = 0;
  s.p = new YT.Player(holder, {
    host: HOSTS[s.hostIdx],
    videoId: s.item.id,
    playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, origin: location.origin },
    events: {
      onReady: e => { try { e.target.mute(); e.target.playVideo(); } catch(_){} tick(); },
      onStateChange: () => tick(),
      onError: e => {
        if (e.data === 153 && !s.triedOther){ s.triedOther = true; s.hostIdx = 1 - s.hostIdx; reloadOne(s.item.key); return; }
        s.err = e.data; tick();
      }
    }
  });
}
function reloadOne(key, auto){
  const s = players[key]; if (!s) return;
  if (!auto){ s.autoN = 0; s.nextAutoAt = 0; }  // 手動重載：自動重載的間隔從頭算
  const wasAudio = s.p && s.p.isMuted && !s.p.isMuted();
  try { s.p && s.p.destroy(); } catch(e){}
  const v = s.tile.querySelector('.video');
  v.querySelector('iframe, .ph') && v.querySelector('iframe, .ph').remove();
  const ph = document.createElement('div'); ph.className = 'ph'; v.prepend(ph);
  s.p = null;
  if (apiReady) makePlayer(s);
  if (wasAudio) setTimeout(() => solo(key), 1500);
}
function muted(s){ try { return !s.p || !s.p.isMuted || s.p.isMuted(); } catch(e){ return true; } }
function solo(key){
  const target = players[key];
  if (target && !muted(target)){ muteAll(); return; }
  for (const [k, s] of Object.entries(players)){
    try { if (k === key){ s.p.unMute(); s.p.playVideo(); } else s.p.mute(); } catch(e){}
  }
  setTimeout(tick, 150);
  // 瀏覽器不准出聲時會把影片暫停：改回靜音繼續播，請使用者直接按畫面上的喇叭
  setTimeout(() => { try { if (target && target.p.getPlayerState() === 2 && !target.p.isMuted()){ target.p.mute(); target.p.playVideo(); toast('瀏覽器擋住出聲，請直接按這格畫面上的喇叭'); tick(); } } catch(e){} }, 1200);
}
function muteAll(){ for (const s of Object.values(players)){ try { s.p.mute(); } catch(e){} } setTimeout(tick, 150); }
function toggleMax(t){
  const on = !t.classList.contains('max');
  document.querySelectorAll('.tile.max').forEach(x => { x.classList.remove('max'); x.querySelector('[data-act=max]').textContent = '放大'; });
  if (on){ t.classList.add('max'); t.querySelector('[data-act=max]').textContent = '縮回'; }
}

const ERR = { 2: '網址的影片代碼不對', 5: '播放器出錯，按「重載」', 100: '找不到影片，或設成私人', 101: '這支影片不允許嵌入，請按右上「↗」到 YouTube 看', 150: '這支影片不允許嵌入，請按右上「↗」到 YouTube 看', 153: location.protocol === 'file:' ? '要用「開總控頁.command」開才看得到' : '這個瀏覽器擋住 YouTube 嵌入畫面，請換瀏覽器，或按右上「↗」到 YouTube 看' };

function statusOf(s, now){
  if (apiFailed) return ['bad', '連不到 YouTube'];
  if (s.err != null) return ['bad', '錯誤'];
  if (!s.p || !s.p.getPlayerState) return ['idle', '載入中'];
  let st; try { st = s.p.getPlayerState(); } catch(e){ return ['idle', '載入中']; }
  let live = false; try { const d = s.p.getVideoData(); live = !!(d && d.isLive); s.title = (d && d.title) || ''; } catch(e){}
  if (st === 1){
    let t = null; try { t = s.p.getCurrentTime(); } catch(e){}
    if (t !== null && s.lastT !== null && Math.abs(t - s.lastT) < 0.01){ if (!s.stall) s.stall = now; } else s.stall = 0;
    s.lastT = t; s.buf = 0;
    if (s.stall && now - s.stall > 8000) return ['bad', '畫面停住'];
    return ['ok', live ? '直播中' : '播放中'];
  }
  s.lastT = null; s.stall = 0;
  if (st === 3){ if (!s.buf) s.buf = now; const sec = Math.round((now - s.buf) / 1000); return [sec > 10 ? 'bad' : 'warn', sec > 3 ? `緩衝 ${sec} 秒` : '緩衝中']; }
  s.buf = 0;
  if (st === 0) return ['bad', '已結束'];
  if (st === 2) return ['warn', '已暫停，自動續播中'];
  return ['idle', '等待開播'];
}

/* ---------- 自動續播：總控牆不該停，被暫停（點到畫面、手機切回來、瀏覽器擋）就自己接著播 ---------- */
function resumeOne(s, now){
  try {
    // 20 秒內已經續播 3 次還是停：多半是瀏覽器不准「有聲音自動播放」，先改回靜音再播
    s.resumeTimes = (s.resumeTimes || []).filter(t => now - t < 20000);
    if (s.resumeTimes.length >= 3 && !s.p.isMuted()){ s.p.mute(); toast('瀏覽器擋住出聲，已改回靜音繼續播'); }
    s.p.playVideo();
    s.resumeTimes.push(now);
  } catch(e){}
}
function autoResume(now){
  if (document.visibilityState !== 'visible') return;
  for (const s of Object.values(players)){
    if (!s.p || !s.p.getPlayerState || s.err != null) continue;
    let st; try { st = s.p.getPlayerState(); } catch(e){ continue; }
    if (st === 2){
      if (!s.pausedSince) s.pausedSince = now;
      if (now - s.pausedSince >= 1500 && now - (s.lastResume || 0) >= 4000){ s.lastResume = now; resumeOne(s, now); }
    } else s.pausedSince = 0;
  }
}
/* ---------- 自動重載：播放器卡在某個狀態不會自己好（直播斷過再接上、還沒開播就打開、網路卡太久），持續一陣子就重載那一格 ---------- */
// 同一格連續自動重載，間隔越來越長（30 秒、1 分、2 分…，最多 5 分鐘；停住、緩衝、等待開播、載入最多 2 分鐘），正常播 1 分鐘後歸零。
// 每 2 秒最多重載一格（網路斷掉時九格不會同時重來）。分頁在背景、剛切回來 15 秒內不動（背景時瀏覽器可能讓影片停住，不算異常）。
const LS_AUTO = 'shuilu-mv-auto';
let autoOn = lsGet(LS_AUTO) !== '0', visibleSince = Date.now(), lastAutoAt = 0;
const AUTO = {  // 種類: [持續多久才重載（毫秒）, 間隔上限（毫秒）, 說明]
  ended: [20000, 300000, '已結束'],
  stall: [15000, 120000, '畫面停住'],
  buf:   [20000, 120000, '緩衝太久'],
  wait:  [60000, 120000, '等待開播太久'],
  load:  [45000, 120000, '載入太久'],
  err:   [10000, 300000, '播放器出錯'],
};
function problemOf(s){
  if (apiFailed || !s.p) return null;
  if (s.err === 5) return 'err';      // 其他錯誤代碼（網址錯、不允許嵌入）重載也沒用
  if (s.err != null) return null;
  if (!s.p.getPlayerState) return 'load';
  let st; try { st = s.p.getPlayerState(); } catch(e){ return null; }
  if (st === 0) return 'ended';
  if (st === 1) return s.stall ? 'stall' : null;
  if (st === 3) return 'buf';
  if (st === 2) return null;          // 暫停交給上面的自動續播
  return 'wait';
}
function autoReload(now){
  const quiet = !autoOn || document.visibilityState !== 'visible' || now - visibleSince < 15000;
  let done = now - lastAutoAt < 2000;  // tick 也會被播放器事件叫到，用時間擋，確保每 2 秒最多一格
  for (const s of Object.values(players)){
    if (s.tile.dataset.s === 'ok'){ if (!s.okSince) s.okSince = now; if (now - s.okSince > 60000) s.autoN = 0; }
    else s.okSince = 0;
    const kind = quiet ? null : problemOf(s);
    if (kind !== s.probKind){ s.probKind = kind; s.probSince = now; }
    if (!kind || done) continue;
    const [need, cap, why] = AUTO[kind];
    if (now - s.probSince < need || now < (s.nextAutoAt || 0)) continue;
    s.autoN = (s.autoN || 0) + 1;
    s.autoTotal = (s.autoTotal || 0) + 1;
    s.nextAutoAt = now + Math.min(cap, 30000 * 2 ** (s.autoN - 1));
    s.autoLast = new Date(now).toLocaleTimeString('zh-TW', { hour12: false }) + ' ' + why;
    s.probKind = null;
    lastAutoAt = now;
    reloadOne(s.item.key, true);
    toast(`「${s.item.name}」${why}，已自動重載`);
    done = true;
  }
}
function renderAutoBtn(){ $('autoBtn').textContent = autoOn ? '自動重載：開' : '自動重載：關'; $('autoBtn').classList.toggle('on', autoOn); }

function playAll(){
  const now = Date.now();
  for (const s of Object.values(players)){
    try { const st = s.p.getPlayerState(); if (st !== 1 && st !== 3) s.p.playVideo(); } catch(e){}
  }
  setTimeout(tick, 300);
}

function tick(){
  const now = Date.now();
  autoResume(now);
  for (const s of Object.values(players)){
    const [cls, label] = statusOf(s, now);
    const t = s.tile;
    t.dataset.s = cls;
    t.querySelector('.chip').textContent = label;
    const vt = t.querySelector('.vt');
    const grp = view === ALL && groups().length > 1 ? s.item.group : '';
    const autoInfo = s.autoTotal ? `自動重載 ${s.autoTotal} 次` : '';
    vt.textContent = [grp, autoInfo, s.title].filter(Boolean).join('｜');
    vt.title = [s.title, s.autoTotal ? `自動重載 ${s.autoTotal} 次，最後一次 ${s.autoLast}` : ''].filter(Boolean).join('\n');
    const msg = t.querySelector('.msg');
    if (s.err != null || apiFailed){
      msg.hidden = false;
      msg.textContent = apiFailed ? '連不到 YouTube，請檢查網路' : (ERR[s.err] || ('播放器錯誤代碼 ' + s.err));
    } else msg.hidden = true;
    const on = !muted(s);
    t.classList.toggle('audio', on);
    const ab = t.querySelector('[data-act=audio]');
    ab.classList.toggle('on', on);
    ab.textContent = on ? '聲音開' : '聲音';
  }
  autoReload(now);
  updateSummary();
}

function updateSummary(){
  const ss = Object.values(players);
  if (!ss.length){ $('sum').textContent = ''; return; }
  let ok = 0, bad = 0;
  ss.forEach(s => { const c = s.tile.dataset.s; if (c === 'ok') ok++; else if (c === 'bad') bad++; });
  const listen = ss.find(s => !muted(s));
  const quiet = lvOn ? new Set(ss.map(s => s.item.id).filter(id => lvData[id] && lvData[id].silent_s >= SILENT_WARN_S)).size : 0;
  $('sum').innerHTML = `在播 <b>${ok}</b>／${ss.length}` + (bad ? `　<span class="bad">異常 ${bad}</span>` : '')
    + (quiet ? `　<span class="warn">沒聲音 ${quiet}</span>` : '') + `　聽：<b></b>`;
  $('sum').querySelector('b:last-child').textContent = listen ? listen.item.name : '靜音';
}

/* ---------- 音量條：只有在這台 Mac 用「開總控頁.command」開才有 ----------
   Mac 上的「總控伺服器.py」在背景替每格只抓直播的聲音（不抓畫面），算峰值（每 0.1 秒）和響度（LUFS）；這裡每 0.15 秒問一次。
   量的是觀眾實際聽到的聲音，跟畫面一樣會比現場晚幾秒。上網版（手機）沒有這個伺服器，音量條不出現。 */
const SILENT_WARN_S = 20, SILENT_BAD_S = 60;
const LV_POLL_MS = 300, LV_FALL = 24, LV_HOLD_MS = 1500, LV_TXT_MS = 450;  // 條往下每秒掉 24 dB（往上立刻到）；白線停 1.5 秒；文字約半秒換一次
// 11/23-3：條一秒畫 60 次（lvFrame），伺服器每 0.3 秒給前後 3 秒的峰值。
// 11/23-2：條跟這格播放器播到的那一秒對齊（見 playPos）。
// 11/23-1：數字改成白線的 dB（跟壇場 NB 上「輸出音量監測表」同一種），顏色改 −13／−2 dB，加每 6 dB 的刻度；響度 LUFS 放旁邊
const LV_STATE = { starting: '聲音連線中…', connecting: '聲音連線中…', reconnect: '聲音重新連線中…',
  upcoming: '聲音：還沒開播', ended: '聲音：直播已結束', error: '抓不到聲音' };
// 11/23-4：上網版（不是 Mac 本機）也有音量條：Mac 量好的數字送到雲端中繼站，這裡每 1 秒去讀。
// 網址不接受參數或 # 指定中繼站；網頁主機名稱以 .localhost 結尾時（本機測試）才改連本機的測試中繼站。
const LV_ONLINE = /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const LV_HUB = /\.localhost$/.test(location.hostname) ? 'http://127.0.0.1:8800' : 'https://obs-hub-production.up.railway.app';
const LV_HUB_POLL_MS = 1000;
let lvOn = LV_ONLINE, lvData = {}, lvFail = 0, lvTimer = null, lvBusy = false, lvHubDown = false;
const secText = s => s >= 60 ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : `${s} 秒`;
const lvPct = db => Math.max(0, Math.min(100, (db + 60) / 60 * 100));
// 11/23-2 對齊：這格播放器現在播到直播的第幾秒（跟伺服器 ffmpeg -copyts 的 t 同一個時間軸：段號×5 秒，11/23 實測）。
// 伺服器回傳「那一秒」的音量，條就跟按「聲音」聽到的同步。播放器沒在播（暫停、還沒開播）回 null＝給最新的。
function playPos(s){
  try {
    const st = s.p.getPlayerState();
    if (st !== 1 && st !== 3) return null;
    const ct = s.p.getCurrentTime();
    if (!(ct > 0)) return null;
    const now = performance.now();
    if (ct !== s.ctLast){ s.ctLast = ct; s.ctAt = now; }
    return st === 1 ? ct + Math.min(2, (now - s.ctAt) / 1000) : ct;   // 兩次回報之間自己往前推（最多 2 秒）
  } catch(e){ return null; }
}
function lvQuery(){
  const ids = [], ts = [];
  for (const s of Object.values(players)){
    if (ids.includes(s.item.id)) continue;
    const pos = playPos(s);
    ids.push(s.item.id); ts.push(pos == null ? '' : pos.toFixed(2));
  }
  return { ids, ts };
}
// 上網版：從雲端中繼站讀。簡單 GET、不帶自訂標頭、不帶 cookie。連不上或回暫停只讓音量條灰掉，不影響畫面、聲音和自動重載。
async function pollHub(){
  if (document.visibilityState === 'hidden') return;
  const { ids, ts } = lvQuery();
  if (!ids.length || lvBusy) return;
  lvBusy = true;
  try {
    const r = await fetch(LV_HUB + '/api/yt-levels?ids=' + ids.slice(0, 16).join(',') + '&ts=' + ts.slice(0, 16).join(','),
      { cache: 'no-store', credentials: 'omit' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    lvData = d.levels || {}; lvFail = 0; lvHubDown = false;
  } catch(e){
    lvFail++;
    if (lvFail >= 3){ lvHubDown = true; lvData = {}; }   // 連續 3 次（約 3 秒）失敗才算連不上
  } finally { lvBusy = false; }
  renderLevels();
}
async function pollLevels(){
  const { ids, ts } = lvQuery();
  if (!ids.length || lvBusy) return;  // 上一次還沒回來就先不問，避免堆積
  lvBusy = true;
  try {
    const r = await fetch('/api/levels?ids=' + ids.join(',') + '&ts=' + ts.join(','), { headers: { 'X-Shuilu': '1' }, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    lvData = d.levels || {}; lvFail = 0;
    if (!lvOn){ lvOn = true; layout(); }
  } catch(e){
    lvFail++;
    if (!lvOn && lvFail >= 3){ clearInterval(lvTimer); lvTimer = null; lvBusy = false; return; }  // 舊的小網站（沒有量音量）：不再問
  } finally { lvBusy = false; }
  renderLevels();
}
function renderLevels(){
  const now = performance.now();
  let textChanged = false;
  for (const s of Object.values(players)){
    const box = s.tile.querySelector('.lv');
    box.hidden = !lvOn;
    if (!lvOn) continue;
    const L = lvData[s.item.id];
    // 11/23-3：條改由 lvFrame 一秒畫 60 次；這裡只把伺服器給的「前後 3 秒峰值」收進來
    if (L && L.sync && L.w) lvMerge(s, L.w); else s.lvBuf = null;
    // 文字約半秒換一次（每 0.15 秒換會看不清楚）
    if (now - (s.lvTxtAt || 0) < LV_TXT_MS) continue;
    s.lvTxtAt = now; textChanged = true;
    let txt = '', avg = '', cls = 'lv';
    s.lvOff = false;
    if (LV_ONLINE && (lvHubDown || (L && L.state === 'paused'))){
      s.lvOff = true; cls += ' off';
      txt = lvHubDown ? '音量暫停（連不上中繼站）' : '音量暫停（' + (L.note || '量音量的電腦沒開') + '）';
    } else if (lvFail >= 10 && !LV_ONLINE) txt = '量音量的程式沒回應（重開「開總控頁.command」）';
    else if (!L) txt = '聲音準備中…';
    else if (L.m != null){
      txt = L.m < -60 ? '沒有聲音' : (s.lvHold > -60 ? `${s.lvHold.toFixed(1)} dB` : '—');   // 跟「輸出音量監測表」右邊的數字同一種：最近的最大值（dB）
      if (L.silent_s >= SILENT_WARN_S){ txt = `沒聲音 ${secText(L.silent_s)}`; cls += L.silent_s >= SILENT_BAD_S ? ' silent long' : ' silent'; }
      avg = L.m >= -60 ? `響度 ${Math.round(L.m)} LUFS` : '';
    } else txt = LV_STATE[L.state] || L.state;
    box.className = cls;
    box.querySelector('.lvtxt').textContent = txt;
    box.querySelector('.lvavg').textContent = avg;
    box.title = '條＝每 0.1 秒的峰值，刻度每 6 dB 一格；顏色跟「輸出音量監測表」、OBS 一樣：−13 dB 起黃、−2 dB 起紅。\n'
      + '白線＝最近 1.5 秒最高，左邊數字就是它（dB），可以跟監測表右邊的數字比。\n'
      + '量的是 YouTube 上觀眾聽到的聲音，比壇場的監測表晚約 10～30 秒，所以同一時間看兩邊會對不上。\n'
      + (LV_ONLINE ? '（上網版：音量由 Mac 量好、經雲端中繼站轉送，Mac 關機時會暫停。）\n' : '')
      + (L && L.sync ? `時間：已跟這格播放器對齊（音量資料比播放器早 ${L.ahead} 秒到；條一秒畫 60 次）。\n`
                     : '時間：還沒跟播放器對齊（播放器沒在播，或音量資料還沒到），先顯示最新的音量。\n')
      + '響度（LUFS）＝聽起來多大聲，一般直播約 −23～−14，跟 dB 是不同的單位。'
      + (L && L.avg != null ? `\n近 1 分鐘有聲音時的平均：${Math.round(L.avg)} LUFS` : '') + (L && L.note ? `\n${L.note}` : '');
  }
  if (textChanged) updateSummary();
}
// 11/23-3：伺服器每次給「播放器前 0.3 秒～後 3 秒」每 0.1 秒的峰值，收在 s.lvBuf（留最近 6 秒）
function lvMerge(s, w){
  if (!w.length) return;
  const b = s.lvBuf || (s.lvBuf = []);
  const t0 = w[0][0];
  while (b.length && b[b.length - 1][0] >= t0 - 1e-6) b.pop();   // 重疊的換成新的
  for (const x of w) b.push(x);
  const cut = w[w.length - 1][0] - 6;
  let i = 0; while (i < b.length && b[i][0] < cut) i++;
  if (i) b.splice(0, i);
}
// 一秒畫 60 次：照這格播放器現在播到的秒數，從 s.lvBuf 找「正在播的那 0.1 秒」的峰值。
// 往上立刻到、往下每秒掉 24 dB；白線＝最近 1.5 秒最高。對不到（播放器沒在播、資料還沒到）就用伺服器給的最新值。
function lvFrame(){
  requestAnimationFrame(lvFrame);
  if (!lvOn) return;
  const now = performance.now();
  for (const s of Object.values(players)){
    const L = lvData[s.item.id];
    const pos = s.lvBuf ? playPos(s) : null;
    const b = s.lvBuf;
    let pk = -100, hold = -100, ok = false;
    if (pos != null && b && b.length && b[0][0] <= pos + 0.1 && b[b.length - 1][0] >= pos){
      ok = true;
      for (let i = b.length - 1; i >= 0; i--){
        const t = b[i][0], p = b[i][1];
        if (t - 0.1 > pos) continue;                  // 還沒播到
        if (pos - t > LV_HOLD_MS / 1000) break;
        if (p == null) continue;
        if (t >= pos && p > pk) pk = p;              // 這 0.1 秒（t−0.1～t）正在播
        if (p > hold) hold = p;
      }
    } else if (L && L.pk != null) pk = L.pk;
    const dt = s.lvAt ? Math.min(0.25, (now - s.lvAt) / 1000) : 0;
    s.lvAt = now;
    s.lvDisp = Math.max(pk, (s.lvDisp == null ? -100 : s.lvDisp) - LV_FALL * dt);
    if (ok) s.lvHold = hold;
    else if (s.lvHold == null || pk >= s.lvHold || now - s.lvHoldAt > LV_HOLD_MS){ s.lvHold = pk; s.lvHoldAt = now; }
    s.lvSmooth = ok;
    const box = s.tile.querySelector('.lv');
    if (box.hidden) continue;
    if (s.lvOff){ s.lvDisp = -100; s.lvHold = -100; continue; }   // 暫停：條灰掉（CSS），不畫
    box.querySelector('i').style.transform = 'scaleX(' + ((100 - lvPct(s.lvDisp)) / 100).toFixed(4) + ')';
    const hb = box.querySelector('b');
    hb.style.display = s.lvHold > -60 ? 'block' : 'none';
    hb.style.left = lvPct(s.lvHold) + '%';
  }
}
if (location.protocol === 'http:' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
  lvTimer = setInterval(pollLevels, LV_POLL_MS);
  requestAnimationFrame(lvFrame);
} else if (LV_ONLINE){
  lvTimer = setInterval(pollHub, LV_HUB_POLL_MS);
  requestAnimationFrame(lvFrame);
}

/* ---------- 音量中繼狀態燈（11/23-6） ---------- */
function relayShow(cls, long_, short, tip){
  const e = $('relay');
  e.hidden = false; e.className = cls;
  e.querySelector('.rl').textContent = long_;
  e.querySelector('.rs').textContent = short;
  e.title = long_ + '\n' + tip + '\n\n資料怎麼走：量音量的電腦 → 雲端中繼站 → 上網版／這個頁面。';
}
function relayOnline(){
  if (lvHubDown) return relayShow('bad', '音量中繼：連不上中繼站', '中繼 斷線', '這個頁面連不上雲端中繼站（網路或中繼站有問題）。畫面、聲音照常，只是音量條暫停。');
  const ks = Object.keys(lvData);
  if (!ks.length) return relayShow('', '音量中繼：—', '中繼 —', '目前沒有可查的直播。');
  if (ks.every(k => lvData[k] && lvData[k].state === 'paused')) return relayShow('', '音量中繼：暫停（量音量的電腦沒開）', '中繼 暫停', '量音量的電腦沒開或沒網路，音量條暫停。畫面、聲音照常。');
  let m = null;
  ks.forEach(k => { const a = lvData[k] && lvData[k].age_s; if (typeof a === 'number' && (m === null || a < m)) m = a; });
  const t = m === null ? '' : '（' + m.toFixed(1) + ' 秒前更新）';
  relayShow('ok', '音量中繼：正常' + t, '中繼 正常', '量音量的電腦有在送資料' + t + '。');
}
async function relayLocal(){
  try {
    const r = await fetch('/api/relay', { cache: 'no-store', headers: { 'X-Shuilu': '1' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json(), h = d.hub || {};
    const mac = { on: 'Mac 上傳：開', off: 'Mac 上傳：停（由筆電量）', failing: 'Mac 上傳：失敗', none: 'Mac 上傳：沒有金鑰' }[d.mac_upload] || '';
    const note = '\n\n注意：這台 Mac 的總控伺服器會每 10 秒去中繼站讀一次，中繼站會因此覺得「有人在看」，量音量的電腦就會開始量。' + (d.mac_err ? '\nMac 上傳最後錯誤：' + d.mac_err : '');
    const tail = mac ? '｜' + mac : '';
    const ms = { on: 'Mac 開', off: 'Mac 停', failing: 'Mac 失敗', none: 'Mac 無金鑰' }[d.mac_upload];
    const S = s => ms ? s + '｜' + ms : s;   // 短字後面加 Mac 上傳狀態
    if (h.ok === null || h.ok === undefined) return relayShow('', '音量中繼：確認中' + tail, S('中繼 …'), '正在查中繼站。' + note);
    if (!h.ok) return relayShow('bad', '音量中繼：連不上中繼站' + tail, S('中繼 斷線'), 'Mac 連不上雲端中繼站。' + note);
    if (!h.total) return relayShow('', '音量中繼：—' + tail, S('中繼 —'), '目前沒有可查的直播。' + note);
    if (h.live === 0) return relayShow('', '音量中繼：暫停（量音量的電腦沒開）' + tail, S('中繼 暫停'), '量音量的電腦沒開或沒網路。' + note);
    const t = typeof h.age_s === 'number' ? '（' + h.age_s.toFixed(1) + ' 秒前更新）' : '';
    relayShow('ok', '音量中繼：正常' + t + tail, S('中繼 正常'), '量音量的電腦有在送資料' + t + '。' + note);
  } catch(e){
    relayShow('bad', '音量中繼：查不到（總控伺服器沒回應）', '中繼 ?', '這個頁面問不到本機總控伺服器。');
  }
}
if (LV_ONLINE) setInterval(relayOnline, 1000);
else if (location.protocol === 'http:' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
  relayLocal(); setInterval(relayLocal, 5000);
}

/* ---------- 編輯網址 ---------- */
function showParseInfo(){
  const { items: it, bad } = parse($('editText').value);
  const gs = [...new Set(it.map(i => i.group))];
  let s = `看得懂 ${it.length} 個網址` + (gs.length ? `，分 ${gs.length} 組：${gs.join('、')}` : '');
  if (bad.length) s += `。有 ${bad.length} 行網址看不懂：${bad.join('；')}`;
  $('parseInfo').textContent = s;
}
function openEditor(){ $('editText').value = text; showParseInfo(); $('editor').showModal(); }
$('editText').addEventListener('input', showParseInfo);
$('editBtn').onclick = openEditor;
$('cancelBtn').onclick = () => $('editor').close();
$('resetBtn').onclick = () => { $('editText').value = DEFAULT_TEXT; showParseInfo(); };
$('applyBtn').onclick = () => {
  text = $('editText').value.trim();
  lsSet(LS_TEXT, text === DEFAULT_TEXT ? null : text);
  $('editor').close();
  apply();
  toast('已套用');
};
const IS_LOCAL = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
// 連結帶「?v=版本」：手機一定抓新版（舊版看不懂短連結）
function shareUrl(t){
  const base = IS_LOCAL ? ONLINE_URL : location.origin + location.pathname;
  return base + '?v=' + $('ver').textContent.trim().replace(/\//g, '') + '#' + (packList(t) || 'list=' + enc(t.trim()));
}
// 手機已經開著總控頁、再點一條只差 # 後面的連結時，瀏覽器不會重新載入：自己重新載入讀新清單
addEventListener('hashchange', () => { if (hasListHash()) location.reload(); });
async function copyLink(t, where){
  const url = shareUrl(t);
  try { await navigator.clipboard.writeText(url); toast('手機連結已複製，貼到 LINE 就能用'); return; } catch(e){}
  openEditor(); $('editText').value = url; $('editText').select(); toast('請按 ⌘C 複製框裡的連結（複製完按取消）');
}
$('shareBtn').hidden = false;
$('shareBtn').textContent = '複製手機連結';
$('shareBtn').onclick = () => copyLink($('editText').value);
$('linkBtn').onclick = () => copyLink(text);
if (!DEFAULT_TEXT) $('resetBtn').hidden = true;

function toast(s){ const t = $('toast'); t.textContent = s; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }

/* ---------- 其他 ---------- */
$('muteAll').onclick = muteAll;
$('playAll').onclick = playAll;
$('autoBtn').onclick = () => { autoOn = !autoOn; lsSet(LS_AUTO, autoOn ? null : '0'); renderAutoBtn(); toast(autoOn ? '自動重載已打開' : '自動重載已關閉，要自己按「重載」'); };
renderAutoBtn();
$('reloadAll').onclick = () => Object.keys(players).forEach(reloadOne);
document.addEventListener('keydown', e => {
  const el = e.target instanceof Element ? e.target : null;
  if (el && el.closest('textarea, input, dialog')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape'){ const m = document.querySelector('.tile.max'); if (m) toggleMax(m); return; }
  if (e.key === '0' || e.key.toLowerCase() === 'm'){ muteAll(); return; }
  if (/^[1-9]$/.test(e.key)){ const t = $('grid').querySelectorAll('.tile')[+e.key - 1]; if (t) solo(t.dataset.key); }
});
window.addEventListener('resize', () => { clearTimeout(layout.h); layout.h = setTimeout(layout, 120); });
setInterval(() => { const d = new Date(); $('clock').textContent = d.toLocaleTimeString('zh-TW', { hour12: false }); }, 500);
setInterval(tick, 2000);

// 螢幕不要自己暗掉（瀏覽器允許才有效）
let wake = null;
async function keepAwake(){ try { if (navigator.wakeLock && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', () => { keepAwake(); if (document.visibilityState === 'visible'){ visibleSince = Date.now(); setTimeout(playAll, 500); } });
keepAwake();

function apply(pickToday){
  items = parse(text).items;
  const savedView = lsGet(LS_VIEW);
  if (savedView) view = savedView;
  const tg = pickToday ? todayGroup() : null;
  if (tg) view = tg;
  renderTabs();
  renderGrid();
}
let lastDay = mmdd();
setInterval(() => {
  const k = mmdd();
  if (k === lastDay) return;
  lastDay = k;
  // Mac 本機版：整頁重新載入，順便拿到總管白天才補進 streams.js 的網址（載入時會自動挑今天那組）
  if (DEFAULT_TEXT && location.protocol === 'http:'){ location.reload(); return; }
  const g = todayGroup();
  if (g && view !== g){ view = g; lsSet(LS_VIEW, g); renderTabs(); renderGrid(); toast(`換成今天（${k.slice(0, 2)}/${k.slice(2)}）的直播`); }
}, 60000);

if (location.protocol === 'file:') $('fileBanner').hidden = false;
loadText();
apply(true);
if (defChanged) setTimeout(() => toast('預設清單更新了，已換成新的網址'), 800);
if (badLink) setTimeout(() => toast('這條手機連結讀不懂（可能貼的時候少了一段），先顯示之前的清單'), 800);

const api = document.createElement('script');
api.src = 'https://www.youtube.com/iframe_api';
api.onerror = () => { apiFailed = true; tick(); };
document.head.appendChild(api);
</script>
